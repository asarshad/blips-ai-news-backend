# Pre-commit hooks — mirrors what backend_pr.yml runs in CI.
# Install once:  pre-commit install --hook-type pre-commit --hook-type pre-push
# Manual run:    pre-commit run --all-files
# Skip (emergency): git commit --no-verify / git push --no-verify

repos:
  # ── Ruff lint + format (runs on every commit) ─────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        name: ruff lint
        args: ["--config", "src/backend/pyproject.toml"]
        files: '^src/backend/'
        types_or: [python]
  # ── Unit + contract tests (runs on push only) ─────────────────────
  - repo: local
    hooks:
      - id: pytest-unit-contract
        name: pytest (unit + contract)
        entry: bash -c 'cd src/backend && PYTHONPATH=. python -m pytest tests/unit tests/contract -x -q'
        language: system
        pass_filenames: false
        files: '^src/backend/'
        stages: [pre-push]
