[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
  "E", "F", "I", "B"
]
ignore = [
  "E501",  # line length handled pragmatically
  "B008",  # function calls in defaults — standard FastAPI pattern (Depends, Query, etc.)
]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E402", "F401", "I001"]  # when ruff runs from src/backend/
"**/alembic/**" = ["E402", "F401", "I001"]  # when ruff runs from repo root (pre-commit)

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
# Keep this minimal; pytest.ini is the primary config.
