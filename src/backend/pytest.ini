[pytest]
minversion = 8.0
testpaths = tests
addopts =
    -ra
    --strict-markers
    --strict-config
    --disable-socket
    --allow-hosts=localhost,127.0.0.1
    -W ignore::urllib3.exceptions.NotOpenSSLWarning
markers =
    unit: fast unit tests (no DB/Redis containers)
    integration: tests requiring Postgres/Redis via containers
    contract: API/OpenAPI contract snapshot tests
filterwarnings =
    ignore:urllib3 v2 only supports OpenSSL.*:urllib3.exceptions.NotOpenSSLWarning
    ignore:Support for class-based `config` is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20
    ignore:The ``declarative_base\(\)`` function is now available.*:sqlalchemy.exc.MovedIn20Warning
