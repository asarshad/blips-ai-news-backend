name: Keep Alive (Render)

on:
  workflow_dispatch:

# NOTE: Scheduled keep-alive is disabled because GitHub-hosted runners can be
# delayed due to quota / scheduling. Use the local macOS keep-alive service
# described in docs/DEPLOY_KEEPALIVE.md instead.

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Keep alive pings
        env:
          # Prefer repo variable; allow secret fallback for convenience.
          HEALTH_URL: ${{ vars.HEALTH_URL || secrets.KEEPALIVE_URL }}
          # Defaults are safe; set vars to override.
          INTERVAL_SECONDS: ${{ vars.KEEPALIVE_INTERVAL_SECONDS }}
          DURATION_SECONDS: ${{ vars.KEEPALIVE_DURATION_SECONDS }}
          TIMEOUT_SECONDS: ${{ vars.KEEPALIVE_TIMEOUT_SECONDS }}
          FAIL_ON_ERROR: ${{ vars.KEEPALIVE_FAIL_ON_ERROR }}
        run: |
          python .github/scripts/keep_alive_ping.py
