name: Keep-Alive Ping

on:
  # Run every 10 minutes
  schedule:
    - cron: '*/10 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
          TIMEOUT_SECONDS: '15'
          DURATION_SECONDS: '0'  # Single ping
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::warning::RENDER_HEALTH_URL secret is not set. Skipping."
            exit 0
          fi
          python .github/scripts/keep_alive_ping.py

      - name: Log ping result
        if: always()
        run: |
          echo "Keep-alive ping completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
