name: Backend (lint + unit + contract)

on:
  pull_request:
    paths:
      - "src/backend/**"
      - ".github/workflows/backend_pr.yml"
  push:
    branches: ["main"]
    paths:
      - "src/backend/**"
      - ".github/workflows/backend_pr.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        env:
          PYTHONPATH: ${{ github.workspace }}/src/backend
        run: |
          ruff check app/ tests/

      - name: Unit + contract tests
        env:
          PYTHONWARNINGS: "ignore:urllib3 v2 only supports OpenSSL.*"
          PYTHONPATH: ${{ github.workspace }}/src/backend
        run: |
          pytest tests/unit tests/contract


