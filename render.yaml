# Render Blueprint Configuration
# https://render.com/docs/blueprint-spec
#
# This file defines a SINGLE environment template.
# Deploy this blueprint separately for dev and prod environments.
# Set environment-specific values in Render dashboard after deployment.

# =============================================================================
# DATABASE
# =============================================================================

databases:
  - name: blips-db
    plan: starter
    databaseName: blips
    user: blips
    region: oregon

# =============================================================================
# SERVICES
# =============================================================================

services:
  # API Service (Web)
  - type: web
    name: blips-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: src/backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --graceful-timeout 30 --max-requests 1000 --max-requests-jitter 50 --access-logfile -
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: DATABASE_URL
        fromDatabase:
          name: blips-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: blips-redis
          type: redis
          property: connectionString
      - key: ADMIN_API_KEY
        sync: false  # Set a strong secret in Render dashboard
      - key: OPENAI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: MISTRAL_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: YOUTUBE_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: LLM_PROVIDER
        sync: false  # Set to "openai" or "mistral" in dashboard
      - key: ENV
        sync: false  # Set to "dev" or "prod" in dashboard
      - key: LOG_LEVEL
        sync: false  # Set to "DEBUG", "INFO", or "WARNING" in dashboard
      - key: DOCS_ENABLED
        value: "false"  # Disable Swagger UI in production
      - key: ALERT_ENABLED
        sync: false  # Set to "true" to enable Slack/webhook alerts
      - key: ALERT_WEBHOOK_URL
        sync: false  # Set to Slack webhook URL in dashboard
      - key: SCHEDULER_ENABLED
        value: "false"  # Scheduler runs on the worker service only
      - key: NEWS_FETCH_INTERVAL_MINUTES
        value: "30"
      - key: INGEST_UNTIL_TARGETS
        value: "true"
      - key: INGEST_CATCHUP_MAX_SECONDS
        value: "1800"
      - key: INGESTION_ENABLED
        value: "true"
      - key: INGESTION_CRON_DISABLED
        value: "false"
      - key: INGESTION_MAX_WORKERS
        value: "1"   # API service doesn't need many ingestion workers
      - key: INGESTION_POLL_SECONDS
        value: "5"
      - key: INGESTION_LEASE_TTL_MS
        value: "60000"
      - key: MAX_ITEMS_PER_RUN
        value: "100"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: REDIS_MAX_CONNECTIONS
        value: "15"
      - key: LLM_DAILY_COST_CEILING
        value: "5.0"

  # Worker Service (Background Jobs)
  - type: worker
    name: blips-worker
    runtime: python
    plan: starter
    region: oregon
    rootDir: src/backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: DATABASE_URL
        fromDatabase:
          name: blips-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: blips-redis
          type: redis
          property: connectionString
      - key: ADMIN_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false  # Set to "openai" or "mistral" in dashboard
      - key: ENV
        sync: false
      - key: LOG_LEVEL
        sync: false
      - key: SCHEDULER_ENABLED
        value: "true"  # Worker service owns all scheduled jobs
      - key: NEWS_FETCH_INTERVAL_MINUTES
        value: "30"
      - key: INGESTION_ENABLED
        value: "true"
      - key: INGESTION_CRON_DISABLED
        value: "false"
      - key: FEATURE_INGESTION_ENABLED
        value: "true"
      - key: INGESTION_MAX_WORKERS
        value: "4"
      - key: MAX_ITEMS_PER_RUN
        value: "100"
      - key: PREFERENCE_DECAY_FACTOR
        value: "0.95"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: REDIS_MAX_CONNECTIONS
        value: "15"
      - key: LLM_DAILY_COST_CEILING
        value: "5.0"

  # Redis
  - type: redis
    name: blips-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: volatile-lru  # Only evict keys with TTL set; protects persistent locks/flags
    ipAllowList: []  # Allow only internal Render services
