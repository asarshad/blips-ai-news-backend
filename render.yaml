# Render Blueprint Configuration
# https://render.com/docs/blueprint-spec
#
# Production environment: API (web) + Worker (background jobs) + Redis.
# After first deploy, set secrets (sync: false) in the Render dashboard for
# each service:
#   ADMIN_API_KEY, OPENAI_API_KEY, MISTRAL_API_KEY, YOUTUBE_API_KEY, LLM_PROVIDER
#
# NOTE: sync: false cannot be used inside envVarGroups (Render ignores it),
# so secrets are defined per-service instead.

# =============================================================================
# PROJECT: blips
# =============================================================================

projects:
  - name: blips
    environments:

      # ═══════════════════════════════════════════════════════════════════════
      # PRODUCTION — dedicated API + Worker (scheduler separated)
      # ═══════════════════════════════════════════════════════════════════════
      - name: production
        databases:
          - name: blips-db
            plan: basic-256mb
            databaseName: blips
            user: blips
            region: oregon

        services:
          # ── Prod API (Web) ────────────────────────────────────────────────
          - type: web
            name: blips-api
            runtime: python
            plan: starter
            autoDeployTrigger: commit
            region: oregon
            rootDir: src/backend
            buildCommand: pip install -r requirements.lock
            startCommand: >-
              alembic upgrade head &&
              gunicorn app.main:app
              --workers 1
              --worker-class uvicorn.workers.UvicornWorker
              --bind 0.0.0.0:$PORT
              --timeout 120
              --graceful-timeout 30
              --max-requests 1000
              --max-requests-jitter 50
              --access-logfile -
            healthCheckPath: /health
            envVars:
              - key: PYTHON_VERSION
                value: "3.11.4"
              - key: DATABASE_URL
                fromDatabase:
                  name: blips-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  name: blips-redis
                  type: redis
                  property: connectionString
              - key: ADMIN_API_KEY
                sync: false
              - key: OPENAI_API_KEY
                sync: false
              - key: MISTRAL_API_KEY
                sync: false
              - key: YOUTUBE_API_KEY
                sync: false
              - key: LLM_PROVIDER
                sync: false
              - key: FIREBASE_SERVICE_ACCOUNT_JSON
                sync: false
              - key: ENV
                sync: false             # Set to "prod" in dashboard
              - key: LOG_LEVEL
                sync: false             # Set to "WARNING" in dashboard
              - key: ALERT_ENABLED
                sync: false
              - key: ALERT_WEBHOOK_URL
                sync: false
              - key: SCHEDULER_ENABLED
                value: "false"          # Prod: worker owns scheduler
              - key: DOCS_ENABLED
                value: "false"
              - key: INGESTION_ENABLED
                value: "false"          # Prod: worker owns ingestion
              - key: FEATURE_CHAT_ENABLED
                value: "true"
              - key: AUTO_APPROVE_REVIEW_CONTENT
                sync: false
              - key: DB_POOL_SIZE
                value: "3"
              - key: DB_MAX_OVERFLOW
                value: "5"
              - key: REDIS_MAX_CONNECTIONS
                value: "15"
              - key: LLM_DAILY_COST_CEILING
                value: "5.0"
              - key: MAX_ITEMS_PER_RUN
                value: "100"
              - key: PUSH_RUNTIME_ENABLED
                value: "true"
              - key: PUSH_MODE
                value: "manual"
              - key: PUSH_CONFIG_TTL_SECONDS
                value: "300"

          # ── Prod Worker (Background Jobs) ─────────────────────────────────
          # Runs APScheduler: ingestion, scoring, clustering, cleanup, AI retry.
          - type: worker
            name: blips-worker
            runtime: python
            plan: starter
            autoDeployTrigger: commit
            region: oregon
            rootDir: src/backend
            buildCommand: pip install -r requirements.lock
            startCommand: python -u -m app.worker
            envVars:
              - key: PYTHON_VERSION
                value: "3.11.4"
              - key: DATABASE_URL
                fromDatabase:
                  name: blips-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  name: blips-redis
                  type: redis
                  property: connectionString
              - key: ADMIN_API_KEY
                sync: false
              - key: OPENAI_API_KEY
                sync: false
              - key: MISTRAL_API_KEY
                sync: false
              - key: YOUTUBE_API_KEY
                sync: false
              - key: LLM_PROVIDER
                sync: false
              - key: FIREBASE_SERVICE_ACCOUNT_JSON
                sync: false
              - key: ENV
                sync: false
              - key: LOG_LEVEL
                sync: false
              - key: SCHEDULER_ENABLED
                value: "true"           # Worker owns all scheduled jobs
              - key: INGESTION_ENABLED
                value: "true"
              - key: FEATURE_INGESTION_ENABLED
                value: "true"
              - key: FEATURE_CHAT_ENABLED
                value: "true"
              - key: AUTO_APPROVE_REVIEW_CONTENT
                sync: false
              - key: INGESTION_MAX_WORKERS
                value: "2"
              - key: INGESTION_BATCH_SIZE
                value: "5"
              - key: NEWS_FETCH_INTERVAL_MINUTES
                value: "30"
              - key: PUSH_RUNTIME_ENABLED
                value: "true"
              - key: PUSH_MODE
                value: "manual"
              - key: PUSH_CONFIG_TTL_SECONDS
                value: "300"
              - key: MAX_ITEMS_PER_RUN
                value: "50"
              - key: INGEST_UNTIL_TARGETS
                value: "true"
              - key: INGEST_CATCHUP_MAX_SECONDS
                value: "1800"
              - key: DAILY_TARGET_ARTICLES
                value: "200"
              - key: YOUTUBE_VIDEO_SEARCH_MIN_INTERVAL_MINUTES
                value: "90"
              - key: YOUTUBE_REEL_SEARCH_MIN_INTERVAL_MINUTES
                value: "60"
              - key: YOUTUBE_SEARCH_MIN_VIDEO_DEFICIT
                value: "1"
              - key: YOUTUBE_SEARCH_MIN_REEL_DEFICIT
                value: "1"
              - key: YOUTUBE_VIDEO_TRENDING_ENABLED
                value: "0"
              - key: YOUTUBE_REEL_TRENDING_ENABLED
                value: "0"
              - key: YT_REEL_UPLOADS_API_ENABLED
                value: "true"
              - key: YT_REEL_UPLOADS_MAX_PAGES
                value: "2"
              - key: YT_REEL_UPLOADS_PAGE_SIZE
                value: "50"
              - key: YT_UPLOADS_PLAYLIST_CACHE_TTL_SECONDS
                value: "2592000"
              - key: YT_CHANNEL_BOOTSTRAP_ENABLED
                value: "true"
              - key: YT_BOOTSTRAP_MAX_PROFILE_AGE_DAYS
                value: "2"
              - key: YT_BOOTSTRAP_MAX_ROWS
                value: "32"
              - key: PREFERENCE_DECAY_FACTOR
                value: "0.95"
              - key: DB_POOL_SIZE
                value: "3"
              - key: DB_MAX_OVERFLOW
                value: "5"
              - key: REDIS_MAX_CONNECTIONS
                value: "15"
              - key: LLM_DAILY_COST_CEILING
                value: "5.0"

          # ── Prod Redis ────────────────────────────────────────────────────
          - type: redis
            name: blips-redis
            plan: starter
            region: oregon
            maxmemoryPolicy: volatile-lru
            ipAllowList: []
